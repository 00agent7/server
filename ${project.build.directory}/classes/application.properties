spring.application.name=Mafia

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/mafia
spring.datasource.username=mafia_user
spring.datasource.password=mafia_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000

# Google Cloud AI Platform Configuration
spring.cloud.gcp.project-id=your-project-id
spring.cloud.gcp.credentials.location=file:/path/to/your/service-account-key.json
vertex.ai.location=us-central1
vertex.ai.model.gemini-pro=gemini-pro
